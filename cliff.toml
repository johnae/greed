# git-cliff turns the commits since the last tag into a CHANGELOG.md
# section. For a release:
#
#   git-cliff --unreleased --tag v0.2.0 --prepend CHANGELOG.md
#
# then write the version's Highlights by hand above its lists, each bullet on
# one line (the release page breaks lines where the file does). The release
# workflow puts that section on the release page.

[changelog]
header = """
# Changelog

What changed in each release of Greed. The commits behind each line are in
the repository's history.
"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}
{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^(feat|spike)", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^(refactor|test|chore|ci|style|build)", skip = true },
  { message = ".*", skip = true },
]
