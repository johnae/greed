[package]
name = "greed-mattermost"
description = "Greed's Mattermost client: keeps Mattermost accounts up to date and answers Greed's chat client over JSON-RPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
futures-util = "0.3"
greed-chat.workspace = true
mime_guess = "2"
reqwest = { version = "0.13", features = ["json", "multipart", "stream"] }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
url.workspace = true

[lints]
workspace = true
