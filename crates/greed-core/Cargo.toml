[package]
name = "greed-core"
description = "Greed's core: buffers, history, registry, keymaps and the Luau host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
hayro = "0.8"
tiny-skia = "0.11"
crossbeam-channel.workspace = true
ignore.workspace = true
greed-text.workspace = true
mlua.workspace = true
nucleo-matcher.workspace = true
regex-cursor.workspace = true
ropey.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
tungstenite.workspace = true
smallvec.workspace = true
streaming-iterator.workspace = true
toml.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
tree-sitter-c.workspace = true
tree-sitter-go.workspace = true
tree-sitter-javascript.workspace = true
tree-sitter-json.workspace = true
tree-sitter-language.workspace = true
tree-sitter-luau.workspace = true
tree-sitter-md.workspace = true
tree-sitter-nix.workspace = true
tree-sitter-python.workspace = true
tree-sitter-rust.workspace = true
tree-sitter-toml-ng.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-yaml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
url.workspace = true
alacritty_terminal = { path = "../../vendor/alacritty_terminal" }
portable-pty = "0.9"
# The version portable-pty uses: terminal settings, signals, the user's id
# and a thread's CPU time.
nix = { version = "0.28", default-features = false, features = ["term", "signal", "user", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
base64 = "0.22"
gethostname = "1.1"
sha2 = "0.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
proptest.workspace = true
# The performance budgets read the process's CPU time and peak memory, and
# count what's allocated.
nix = { version = "0.28", default-features = false, features = ["resource"] }
stats_alloc = "0.1"

[lints]
workspace = true
