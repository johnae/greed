[package]
name = "greed-editor"
description = "Greed, a General Runtime for Editing, Extending and Delegating: an extensible editor and more"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "greed"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossbeam-channel.workspace = true
crossterm.workspace = true
greed-core.workspace = true
gethostname = "1.1"
greed-gui = { path = "../greed-gui", optional = true }
greed-text.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[lints]
workspace = true

[features]
default = ["gui"]
# The window client, `greed --gui`. Off for the static build that runs on
# servers.
gui = ["dep:greed-gui"]
