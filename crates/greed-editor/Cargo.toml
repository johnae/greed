[package]
name = "greed-editor"
description = "A modal text editor with Helix, Vim and VS Code keys and Luau plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "greed"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossbeam-channel.workspace = true
crossterm.workspace = true
greed-core.workspace = true
gethostname = "1.1"
sha2 = "0.10"
greed-gui = { path = "../greed-gui", optional = true }
greed-text.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"] }

[lints]
workspace = true

[features]
default = ["gui"]
# The window client, `greed --gui`. Off for the static build that runs on
# servers.
gui = ["dep:greed-gui"]

# musl's allocator takes a lock for every allocation, which made the static
# build's plugin tests 13 times slower than glibc's.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false, features = ["override"] }

# Whether Shift is held as the app opens, to start fresh.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEventSource", "CGEventTypes"] }
