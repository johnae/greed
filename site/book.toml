# Builds the docs as a website with mdBook. The pages are in runtime/docs,
# where the editor has them too; `site/build.sh` copies them next to this
# and the theme, with the reference pages generated from the editor.
[book]
title = "Greed"
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
additional-css = ["theme/greed.css"]
additional-js = ["theme/greed.js"]
site-url = "/docs/"
no-section-label = true
git-repository-url = "https://github.com/johnae/greed"
