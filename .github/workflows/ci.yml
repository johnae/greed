# The checks from CLAUDE.md's "Working here", on Linux and macOS, with the
# tools devenv gives (luau-analyze, luau-lsp, stylua, cmake).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: devenv shell -- cargo fmt --check
      - name: clippy
        run: devenv shell -- cargo clippy -q --workspace --all-targets -- -D warnings
      - name: stylua
        run: devenv shell -- stylua --check runtime
      - name: licenses
        if: runner.os == 'Linux'
        run: devenv shell -- cargo deny check licenses
      - name: test
        run: devenv shell -- cargo test -q --workspace --no-fail-fast
