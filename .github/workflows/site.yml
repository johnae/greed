# Builds greed.rs (site/build.sh) and publishes it with GitHub Pages. In the
# repository's settings, Pages' source has to be "GitHub Actions".
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "runtime/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - run: site/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
