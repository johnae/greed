# What CONTRIBUTING.md's "Keep it small" asks of a pull request, checked:
# CHANGELOG.md isn't edited (git-cliff writes it at release), and a big
# diff is labelled for a closer look. It runs on pull_request_target to
# label PRs from forks, so it never checks out their code: it reads only
# what the API says about the PR.
name: pr

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  small:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
      CHANGED: ${{ github.event.pull_request.additions }}
      REMOVED: ${{ github.event.pull_request.deletions }}
    steps:
      - name: Big diffs are labelled
        run: |
          lines=$((CHANGED + REMOVED))
          if [ "$lines" -gt 400 ]; then
            gh label create large --repo "$REPO" --color d93f0b \
              --description "Over 400 changed lines: needs a reason" 2>/dev/null || true
            gh pr edit "$PR" --repo "$REPO" --add-label large
            echo "::warning::$lines lines changed; see Keep it small in CONTRIBUTING.md"
          else
            gh pr edit "$PR" --repo "$REPO" --remove-label large 2>/dev/null || true
          fi
      - name: CHANGELOG.md is left alone
        run: |
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | grep -qx 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md is written from the commits at release; leave it out of the PR"
            exit 1
          fi
