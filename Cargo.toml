[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"

[workspace.dependencies]
crossbeam-channel = "0.5"
crossterm = "0.29"
greed-core = { path = "crates/greed-core" }
greed-text = { path = "crates/greed-text" }
ignore = "0.4"
mlua = { version = "0.12", features = ["luau", "error-send", "serialize"] }
nucleo-matcher = "0.3"
proptest = "1.11"
regex-cursor = { version = "0.1", features = ["ropey"] }
ropey = "1.6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
similar = "3.2"
tungstenite = "0.30"
smallvec = { version = "1.16", features = ["union", "serde"] }
streaming-iterator = "0.1"
toml = "1.1"
tree-sitter = { version = "0.27", features = ["wasm"] }
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-language = "0.1"
tree-sitter-luau = "1.2"
tree-sitter-md = "0.5"
tree-sitter-nix = "0.3"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"

# Dev builds: dependencies are optimised, with only the line tables
# backtraces need, so tests and the editor run fast while the workspace's
# own crates still build quickly with full debug info. Release builds are
# unaffected.
[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = "line-tables-only"

# The Luau compiler and VM, where loading plugins and running them spends
# its time.
[profile.dev.package.mlua-sys]
opt-level = 3
