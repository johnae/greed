[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
crossbeam-channel = "0.5"
crossterm = "0.29"
kern-core = { path = "crates/kern-core" }
kern-text = { path = "crates/kern-text" }
ignore = "0.4"
mlua = { version = "0.12", features = ["luau", "error-send", "serialize"] }
nucleo-matcher = "0.3"
proptest = "1.11"
regex-cursor = { version = "0.1", features = ["ropey"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3.2"
smallvec = { version = "1.16", features = ["union"] }
streaming-iterator = "0.1"
toml = "1.1"
tree-sitter = "0.27"
tree-sitter-json = "0.24"
tree-sitter-language = "0.1"
tree-sitter-luau = "1.2"
tree-sitter-md = "0.5"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
unicode-segmentation = "1.13"
unicode-width = "0.2"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
many_single_char_names = "allow"
